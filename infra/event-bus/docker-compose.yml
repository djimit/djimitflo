services:
  redis:
    image: redis:7-alpine
    container_name: event-bus-redis
    restart: unless-stopped
    env_file: /etc/djimit-agents/agents.env
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    volumes:
      - event-bus-data:/data

  event-bus:
    build: .
    container_name: event-bus
    ports:
      - "100.86.47.122:8083:8000"
    env_file: /etc/djimit-agents/agents.env
    environment:
      # S3 fleet auth: off | log | enforce (runbook docs/runbooks/fleet-bus-auth.md). Override in /srv/event-bus/.env.
      AUTH_MODE: ${AUTH_MODE:-log}
      FLEET_TOKENS_FILE: /run/fleet/tokens
    volumes:
      # "<host> <sha256 of token>" lines; a directory mount so an atomic replace of the file is seen without restart
      - /etc/djimit-agents/fleet-auth:/run/fleet:ro
    depends_on:
      - redis
    restart: unless-stopped

volumes:
  event-bus-data:
