name: Stale Management
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          stale-issue-message: 'This issue has been inactive for 60 days. It will be closed in 7 days unless updated.'
          stale-pr-message: 'This PR has been inactive for 45 days. It will be closed in 7 days unless updated.'
          close-issue-message: 'Closed due to inactivity. Reopen if still relevant.'
          close-pr-message: 'Closed due to inactivity. Reopen if still relevant.'
          days-before-issue-stale: 60
          days-before-pr-stale: 45
          days-before-issue-close: 7
          days-before-pr-close: 7
          stale-issue-label: stale
          stale-pr-label: stale
          exempt-issue-labels: 'P0-now,P1-this-week,security,critical'
          exempt-pr-labels: 'security,critical,wip'
