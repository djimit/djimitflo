name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22, 24]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm run test -- --reporter=verbose

      - name: Test Commons runtime poller
        run: python3 -m unittest discover -s scripts -p 'test_*poller.py'

      - name: Security audit
        run: npm run audit:ci

  fleet-auth-infra:
    # S3: the event bus / agent registry sources in infra/ (installed on the VPS by docs/runbooks/fleet-bus-auth.md)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Test event bus and agent registry auth
        run: |
          cmp infra/event-bus/fleet_auth.py infra/agent-registry/fleet_auth.py
          for svc in event-bus agent-registry; do
            python3 -m venv "$RUNNER_TEMP/venv-$svc"
            "$RUNNER_TEMP/venv-$svc/bin/pip" install -q -r "infra/$svc/requirements.txt"
            (cd "infra/$svc" && "$RUNNER_TEMP/venv-$svc/bin/python" -m unittest discover -s tests -v)
          done

  security-scan:
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

      - name: Build container image
        run: docker build --tag djimitflo-ci:${{ github.sha }} .

      - name: Scan container image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'image'
          image-ref: 'djimitflo-ci:${{ github.sha }}'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          exit-code: '1'

  mutation-test:
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build shared contracts
        run: npm run build --workspace=@djimitflo/shared

      - name: Verify governance invariants with mutation testing
        run: npm run test:mutation

  sbom:
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Generate SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom.cdx.json
          artifact-name: sbom-cyclonedx
