name: Dependabot Auto-Merge
on: pull_request

permissions:
  contents: write
  pull-requests: write
  actions: write

# A newer head of the same PR supersedes the wait for the older one.
concurrency:
  group: dependabot-auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Inlined rather than calling djimit/.github's reusable workflow: that repo is
# private with Actions access_level "none", so a public repo like this one
# cannot call its reusable workflow (the call fails at startup).
#
# Not GitHub's native auto-merge: it counts a skipped required check as passed.
# scripts/dependabot-merge.sh (run from main, never from the PR) waits for the
# repo gate on the exact head — required checks only from their required app,
# newest run per name per app, skipped/neutral/missing never green — and merges
# pinned to that head (operator decision on #1061).
jobs:
  auto-merge:
    if: github.actor == 'dependabot[bot]' && github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Check out the gate from main
        if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Merge patch/minor updates once the gate is green on the exact head
        if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        run: bash scripts/dependabot-merge.sh "$PR_NUMBER" "$HEAD_SHA"
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MERGE_TRAIN_REPO: ${{ github.repository }}
          MT_IGNORE_CHECKS: auto-merge
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # A GITHUB_TOKEN merge starts no push workflows, so main's head would never get the required checks and
      # auto-deploy would wait on it (be57e146, 2026-10-30). workflow_dispatch is the documented exception.
      - name: Run the required workflows on main after a merge
        if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        run: |
          state=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json state -q .state)
          [ "$state" = MERGED ] || { echo "#$PR_NUMBER $state — no dispatch"; exit 0; }
          for wf in ci.yml secret-scan.yml; do gh workflow run "$wf" --repo "$GITHUB_REPOSITORY" --ref main; done
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
