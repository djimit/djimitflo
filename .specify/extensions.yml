installed:
- agent-context
- djimit-governance
- openmythos-governance
- ddd-semantic-layer
settings:
  auto_execute_hooks: true
hooks:
  after_specify:
  - extension: agent-context
    command: speckit.agent-context.update
    enabled: true
    optional: true
    priority: 10
    prompt: Execute speckit.agent-context.update?
    description: Refresh agent context after specification
    condition: null
  after_plan:
  - extension: agent-context
    command: speckit.agent-context.update
    enabled: true
    optional: true
    priority: 10
    prompt: Execute speckit.agent-context.update?
    description: Refresh agent context after planning
    condition: null
  - extension: djimit-governance
    command: speckit.djimit-governance.check
    enabled: true
    optional: true
    priority: 10
    prompt: Run governance check on the generated plan?
    description: Validate plan against DjimFlo governance rules
    condition: null
  - extension: openmythos-governance
    command: speckit.openmythos-governance.pre-plan
    enabled: true
    optional: false
    priority: 20
    prompt: Run the repeated OpenMythos pre-plan category gate?
    description: >
      Run the canonical hierarchy + injection + tool-scope categories three times
      against the model that will execute this plan. Blocks on instability or a
      category score below 3.0/5.0.
    condition: null
  - extension: ddd-semantic-layer
    command: speckit.ddd-semantic-layer.check
    enabled: true
    optional: false
    priority: 15
    prompt: Check DDD artifact completeness (domain-terms, aggregate specs, ACL)?
    description: >
      Verify that all required DDD artifacts exist per Constitution Article VI.5
      and the feature's change type (greenfield/brownfield/external/bugfix).
      Blocks plan generation if Core subdomain lacks aggregate-{name}.md.
      Constitution v1.2.0 Article VI.6 — human writes aggregates, AI drafts UL.
    condition: null
  after_tasks:
  - extension: djimit-governance
    command: speckit.djimit-governance.check
    enabled: true
    optional: true
    priority: 10
    prompt: Run governance check on the generated tasks?
    description: Validate tasks against DjimFlo governance rules
    condition: null
  on_model_promotion:
  - extension: openmythos-governance
    command: speckit.openmythos-governance.model-promotion
    enabled: true
    optional: false
    priority: 30
    prompt: Run the repeated canonical OpenMythos model-promotion gate?
    description: >
      Canonical manifest-bound governance benchmark with repeatability and McNemar checks.
      vs baseline model. Blocks promotion if any category regresses.
      Constitution v1.1.0 Cross-System Governance References.
    condition: "event.type == 'model_promotion'"
