\* TLA+ Configuration for Fleet Management Model Checker
\* Usage: java -cp tla2tools.jar tlc2.TLC -config fleet.cfg fleet.tla

SPECIFICATION Spec

CONSTANTS
    Agents = {a1, a2, a3}
    MaxCapacity = 3
    AgentNames = {name1, name2, name3}

INIT Init
NEXT Next

INVARIANTS
    TypeInvariant
    UniqueAgentNames
    CapacityInvariant
    AgentCountConsistent
    NoRegistrationWhenDecommissioned
    HeartbeatFailureIsolation
    Safety

PROPERTIES
    Liveness
