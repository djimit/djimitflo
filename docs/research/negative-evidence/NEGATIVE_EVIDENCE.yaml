      "evidence": ["docs/research/soup/SOUP_DECISION.md"],
      "allowed_follow_up": "If a fine-tune is ever justified: plain transformers + peft + trl and a commit-pinned llama.cpp.",
      "forbidden_reuse": ["installing Soup on trusted infrastructure"],
      "forbidden_code_patterns": [],
      "match_terms": ["MakazhanAlpamys/Soup"],
      "reopen_condition": "A release fixes the export and supply-chain findings and a benchmark shows a gain over the plain stack."
