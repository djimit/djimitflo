      "result": "Held-out kill FEEDBACK 0.325 vs CONTROL 0.467: paired delta -0.142, bootstrap 95 % CI [-0.250, -0.033], one-sided permutation p 0.996 (n 40 pairs). Shown-mutant kill 0.81 vs 0.53 (the feedback was used). Baseline-red 0.000 vs 0.025. Both-ok pairs (n 32): delta -0.146.",
      "why": "The feedback made the maker write narrow assertions aimed at the listed mutations (median 90 vs 206 added lines) and stop: it killed the shown mutants and generalised worse to unseen ones than a generic strengthening. Mutant lists teach to the oracle.",
      "evidence": [
