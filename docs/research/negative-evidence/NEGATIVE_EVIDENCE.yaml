      "result": "0 of 24 reached a goal: 10 unparseable panel archived (defect, fixed #758), 6 no refinement (COMMONS_GROUNDING_APPLY off), 3 panel backlog, 5 genuine rejections; operator D5 labels agreed with 17 of 18 rejections.",
      "why": "The proposals are feature ideas without an independent executable oracle; the path was kept off after the defects were fixed.",
      "evidence": ["docs/research/eco/PHASE0_AUDIT.md", "docs/research/eco/CODEX_REPORT.md", "PR #758", "PR #763 (funnel stop-step counts)"],
      "allowed_follow_up": "A grounded proposal with a file + one-command oracle goes through the existing oracle lanes.",
      "forbidden_reuse": ["re-enabling COMMONS_GROUNDING_APPLY to raise proposal volume"],
      "forbidden_code_patterns": [],
      "match_terms": ["COMMONS_GROUNDING_APPLY"],
      "reopen_condition": "Grounded proposals carry an executable target that an oracle lane can judge."
    },
    {
      "id": "NE-004",
      "title": "More mutations per file make gym tasks harder (H2)",
      "hypothesis": "Gym mutant-repair tasks at tiers 4-6 have a lower pass rate than tiers 1-3, giving selection pressure.",
      "verdict": "INCONCLUSIVE",
      "decided_on": "2026-10-06",
      "conditions": "RX-5 tier probe, workstation atomic@llama-router, small n per tier.",
      "result": "Pass rate tier1 0.89 (9), tier2 0.89 (45), tier3 0.98 (45), tier4 1.0 (5), tier5 0.83 (6), tier6 1.0 (4); trending falsified.",
      "why": "Mutation count barely changes difficulty for this species; tiers 4-6 have n < 20.",
      "evidence": ["evolution_estimates table (RX-14 nightly thermometer, 2026-10-06)", "operator plan Phase F (Batch-5, 2026-10-06)"],
      "allowed_follow_up": "Other task sources (failure-derived write_test with killed-mutant oracle, TG-001 matched tasks).",
      "forbidden_reuse": ["raising DREAM_TRIAL_MUTANT_TIERS as a difficulty lever without new evidence"],
      "forbidden_code_patterns": [],
      "match_terms": ["DREAM_TRIAL_MUTANT_TIERS"],
      "reopen_condition": "Tiers 4-6 reach n >= 20 each and show a pass rate in 30-55 %."
    },
    {
      "id": "NE-005",
      "title": "Clef Flash as a better System One backend than jev",
      "hypothesis": "Clef Flash (local, Ollama 0.35.1) beats jev on Djimitflo's outcome-labelled judgment states.",
      "verdict": "REJECT",
      "decided_on": "2026-10-03",
      "conditions": "99 proposals with a jev proposal_prescreen verdict and a resolved outcome (17 verified); identical state + 4 questions; MacBook M4 Pro.",
      "result": "AUC jev 0.779 / Clef 0.758; Brier 0.378 / 0.255, both worse than the per-source base rate 0.124; per-question agreement 87-99 %; equivalent, not better.",
      "why": "No measured advantage; n = 99 with 17 positives; jev stays the only System One backend (operator decision 2026-09-30).",
      "evidence": ["operator plan Phase X (Clef Flash replay, 2026-10-03)"],
      "allowed_follow_up": "Clef Flash as a local fallback only if jev outages matter (operator decision).",
      "forbidden_reuse": ["switching the System One backend without a new outcome-labelled comparison"],
      "forbidden_code_patterns": [],
      "match_terms": ["Clef Flash"],
      "reopen_condition": "A pre-registered comparison on newer labelled data shows Clef ahead with a CI excluding zero."
    },
