        "docs/research/eco/mfr-001/items.json"
      ],
      "allowed_follow_up": "A held-out mutant set remains a usable oracle for test-writing lanes (it measured a clear difference here). A different feedback form (e.g. the mutated behaviour described without line-level diffs, or feedback plus a breadth instruction) needs its own pre-registration and fresh held-out mutants.",
