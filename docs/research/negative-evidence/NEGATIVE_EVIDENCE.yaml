    {
      "id": "NE-001",
      "title": "jev confidence routing for proposal pre-screen (cascade skip of the kimi panel)",
      "hypothesis": "jev proposal_prescreen confidence selects proposals whose kimi-k3 panel review can be skipped at a validated selective risk (P(error | accepted) low enough to accept without the panel).",
      "verdict": "REJECT",
      "decided_on": "2026-10-11",
      "conditions": "Djimitflo's own distribution; proposal_prescreen shadow-mode rows with a resolved outcome up to 2026-10-11; 197 proposals in 152 case clusters (requeue copies, refinements, near-duplicates cosine >= 0.92, same target in one cluster); train 130 rows (96 clusters) / holdout 48 rows (42 clusters).",
      "result": "Frozen rule chose t* = 0.95 on train (risk 0.048, coverage 0.485). Holdout, evaluated once: risk 0.20 (Wilson 95 % 0.07-0.45), coverage 0.31 (3 of 15 skipped proposals later verified). Train AUROC 0.761 (cluster bootstrap 0.650-0.843).",
      "why": "All three holdout false accepts were proposals jev itself rated 'yes' (concrete = 0.94): the threshold sits inside jev's own accept band, where confidence does not separate proposals that later verify. Matches the paper's stated limit on reference-free prose (arXiv 2609.26550).",
      "evidence": [
        "PR #779",
        "commit 59e7f690 (pre-registration, frozen before the holdout was opened)",
        "commit 0e64ba88 (results)",
        "PREREG_SHA256 fbc9c5d180929c43844ec8beca26bd5fbd7a62ca43b472c3efc369c0b08bbab1",
        "split sha256 1c4b6e55bcaea12621e059b93d984bae5625c945d85b4ee1ff83222bb323737a",
        "docs/research/eco/JEV_CASCADE_STUDY.md"
      ],
      "disclosure": "Aggregate decision x outcome counts across all rows (holdout included) were seen before the pre-registration was frozen; no score, threshold or curve had been computed (study section 1.1).",
      "allowed_follow_up": "t <= 0.90 only as a prospective hypothesis, pre-registered anew and evaluated on proposals created after 2026-10-11. The JC holdout is never reused.",
      "forbidden_reuse": [
        "threshold selection or tuning on the JC holdout",
        "a shadow or acting cascade router built from this study",
        "jev confidence for semantic approval, promotion, code, risk or fitness decisions"
      ],
      "forbidden_code_patterns": ["CASCADE_JUDGE_MODE", "prescreen_cascade", "PRESCREEN_CASCADE"],
      "reopen_condition": "A new pre-registered study on proposals created after 2026-10-11 with its own frozen holdout, independent ground truth and case-level clusters reaches its own GO criteria. Until then this entry stands."
    },
